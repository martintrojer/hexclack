# Synthetic full-layout fixture; not a runnable personal setup.
pages = ["utils", "home", "music"]

[device]
brightness = 80
clock_minutes = 30   # screen saver: large clock after 30 idle minutes (0: off)
sleep_minutes = 120  # keys off after 2 h idle (0: never)

[auto_brightness]
# Deck brightness from the room light: sensor.example.test's LTR303 visible_light (raw count, not lux) -> percent.
url = "http://sensor.example.test:8044/sensors"
points = [[0, 25], [30, 50], [200, 90], [1000, 100]]

[gestures]
double_ms = 300
hold_ms = 500

[watchdog]
interval_s = 10
health_timeout_s = 2
uhubctl = false

[secrets]
pihole_service = "hexclack-pihole"

[screens.home]
kind = "page"

[screens.home.keys."0,0"]
icon = "icons/nav/navigation.png"
nav = { page = "prev" }
alerts = true  # border in the screen saver's alert colour while anything is wrong

[screens.home.keys."1,0"]
icon = "icons/nav/navigation.png"
nav = { folder = "messages" }

[screens.home.keys."2,0"]
icon = "icons/nav/navigation.png"
nav = { page = "next" }

[screens.home.keys."0,1"]
widget = "now-playing-love"
music = { action = "love" }

[screens.home.keys."1,1"]
widget = "now-playing"
music = { action = "play_pause" }

[screens.home.keys."2,1"]
icon = "icons/tile.png"
[screens.home.keys."2,1".tap]
music = { action = "next" }
[screens.home.keys."2,1".double]
music = { action = "previous" }
[screens.home.keys."2,1".hold]
music = { action = "shuffle" }

[screens.utils]
kind = "page"

[screens.utils.keys."0,0"]
nav = { home = true }

[screens.utils.keys."1,1"]
title = "server.example.test"
widget = "pihole-status"
pihole = { host = "server.example.test:8000", disable_seconds = 3600 }

[screens.utils.keys."2,1"]
title = "sensor.example.test"
widget = "pihole-status"
pihole = { host = "sensor.example.test:8000", disable_seconds = 3600 }

[screens.utils.keys."1,0"]
title = "server.example.test"
widget = "health-json"
health = { url = "http://server.example.test/health.json" }  # read-only GET; display only

[screens.utils.keys."2,0"]
title = "sensor.example.test"
widget = "sensors"
health = { url = "http://sensor.example.test:8044/sensors" }  # infodisp's read-only sensor API; display only

[screens.utils.keys."0,1"]
title = "Dirac"
[screens.utils.keys."0,1".toggle]
# The key shows Dirac's real state (GET /api/filtering); a press switches to the other state.
status = { url = "http://audio.example.test:4711/api/filtering", field = "enabled" }
states = [
  { label = "Dirac Off", value = 0, icon = "icons/off.png", http = { method = "PUT", url = "http://audio.example.test:4711/api/filtering?enabled=0" } },
  { label = "Dirac On", value = 1, icon = "icons/on.png", http = { method = "PUT", url = "http://audio.example.test:4711/api/filtering?enabled=1" } },
]

[screens.messages]
kind = "folder"
parent = "home"

[screens.messages.keys."0,1"]
title = "Door"
icon = "icons/tile.png"
shell = { cmd = "osascript -e 'tell application \"Messages\" to send \"Im getting the door!\" to buddy \"recipient@example.com\"'" }

[screens.messages.keys."1,1"]
title = "Tea"
icon = "icons/tile.png"
shell = { cmd = "osascript -e 'tell application \"Messages\" to send \"Time for tea?\" to buddy \"recipient@example.com\"'" }

[screens.messages.keys."2,1"]
title = "Home"
icon = "icons/tile.png"
shell = { cmd = "osascript -e 'tell application \"Messages\" to send \"When are you coming home today?\" to buddy \"recipient@example.com\"'" }

